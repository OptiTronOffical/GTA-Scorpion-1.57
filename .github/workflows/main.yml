name: Build SPRX

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openorbisofficial/toolchain:latest
      # The toolchain image runs as the unprivileged 'orbis' user by default.
      # If your build needs root, uncomment the next line.
      # options: --user root
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta5menu-1.57
          path: |
            build/gta5menu.prx
            build/libgta5menu.so
          if-no-files-found: error
