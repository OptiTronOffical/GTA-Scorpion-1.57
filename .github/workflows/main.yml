name: Build SPRX

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Community-maintained OpenOrbis PS4 toolchain image
      image: openorbis/ps4-toolchain:latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta5menu-1.57
          path: |
            build/gta5menu.prx
            build/libgta5menu.so
          if-no-files-found: error
